name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build action
        run: npm run build

      - name: Package dist
        run: |
          tar -czf dist.tar.gz -C dist .

      - name: Resolve release name
        id: release_name
        run: |
          echo "release_name=Version ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish a Draft Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed

            **Changelog:**
          draft: true
          name: ${{ steps.release_name.outputs.release_name }}
          generate_release_notes: true
          append_body: true
          files: |
            dist.tar.gz
