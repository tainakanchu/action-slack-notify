name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - node-master
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build action
        run: npm run build

      - name: Ensure dist/ is committed
        run: |
          if [[ -n "$(git status --short -- dist)" ]]; then
            echo "::error::dist/ has uncommitted changes. Run 'npm run build' locally and commit the results."
            git status --short -- dist
            exit 1
          fi
